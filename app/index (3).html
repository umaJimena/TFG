<title>Conect_Car — Car-sharing diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6ECDE;
    --cream-2: #ECE1D5;
    --cream-3: #E3D6C6;
    --paper: #FBF3E6;
    --ink: #141A45;
    --ink-soft: #2A305B;
    --ink-ghost: rgba(20,26,69,0.55);
    --ink-line: rgba(20,26,69,0.12);
    --mustard: #E9B949;
    --mustard-ink: #4A3510;
    --leaf: #4E7D4B;
    --leaf-ink: #1B2E1A;
    --coral: #E26B5A;
    --coral-ink: #4A1810;
    --sky: #BFD7E8;
    --sky-ink: #0F2A3D;
    --sand: #D9C6A5;
    --black: #0A0A0A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: rgb(100, 158, 97); font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  body { min-height: 100vh; overflow-x: hidden; }
  #root { min-height: 100vh; }

  .serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* scrollbars for phone frames */
  .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .phone-scroll { scrollbar-width: none; }

  /* soft button press */
  button, .pressable { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 120ms ease, opacity 120ms ease, background 120ms ease, box-shadow 120ms ease; }
  button:active, .pressable:active { transform: scale(0.97); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  }

  /* subtle grain on cream surfaces */
  .grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background-image: radial-gradient(rgba(20,26,69,0.035) 1px, transparent 1.2px);
    background-size: 3px 3px; mix-blend-mode: multiply; opacity: .55;
  }

  /* canvas backdrop */
  .canvas-bg {
    background: rgb(100, 158, 97);
  }

  /* scroll snap for canvas */
  .phone-row { scroll-snap-type: x mandatory; }
  .phone-row > * { scroll-snap-align: center; }

  /* animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp 320ms ease both; }

  @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.3); opacity: .55; } }
  .pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }

  @keyframes slide-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* wobble for toggle */
  .wobble { transition: transform 260ms cubic-bezier(.34,1.56,.64,1); }

  /* expandable card */
  .trip-card { transition: background 260ms ease, box-shadow 260ms ease, transform 260ms ease; }
</style>
</head>

    "role": "passenger",

  }/*EDITMODE-END*/;
</script>
